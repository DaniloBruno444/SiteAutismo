version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: site_teadobem_frontend
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - n8n_default
      - teadobem_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.site-teadobem.rule=Host(`site.danilobruno.com.br`)"
      - "traefik.http.routers.site-teadobem.entrypoints=websecure"
      - "traefik.http.routers.site-teadobem.tls=true"
      - "traefik.http.routers.site-teadobem.tls.certresolver=mytlschallenge"
      - "traefik.http.services.site-teadobem.loadbalancer.server.port=80"
      - "traefik.docker.network=n8n_default"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: site_teadobem_backend
    restart: always
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - CORS_ORIGINS=https://site.danilobruno.com.br,http://localhost:3000
      - DB_NAME=teadobem
    depends_on:
      - mongodb
    networks:
      - n8n_default
      - teadobem_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.site-teadobem-api.rule=Host(`site.danilobruno.com.br`) && PathPrefix(`/api`)"
      - "traefik.http.routers.site-teadobem-api.entrypoints=websecure"
      - "traefik.http.routers.site-teadobem-api.tls=true"
      - "traefik.http.routers.site-teadobem-api.tls.certresolver=mytlschallenge"
      - "traefik.http.services.site-teadobem-api.loadbalancer.server.port=8000"
      - "traefik.docker.network=n8n_default"

  mongodb:
    image: mongo:latest
    container_name: site_teadobem_mongodb
    restart: always
    volumes:
      - mongodb_data:/data/db
    networks:
      - teadobem_network

networks:
  n8n_default:
    external: true
  teadobem_network:
    driver: bridge

volumes:
  mongodb_data:
